[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wia-agent"
version = "0.3.0"
description = "Workspace Intelligence Agent (WIA) — Graph-grounded workspace intelligence platform for code understanding, AST parsing, flow tracing, and RAG Q&A"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "WIA Architecture Team", email = "architect@wia-agent.dev"}
]
keywords = [
    "codebase-intelligence",
    "workspace-intelligence",
    "ast-parser",
    "knowledge-graph",
    "nvidia-nim",
    "hybrid-retrieval",
    "code-rag",
    "flow-tracing",
    "impact-analysis",
    "developer-onboarding"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.0",
    "GitPython>=3.1.0",
    "tree-sitter>=0.21.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "networkx>=3.0",
    "typer>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0"
]
postgres = [
    "psycopg2-binary>=2.9.0"
]

[project.scripts]
wia = "app.cli:cli_entry"

[project.urls]
Homepage = "https://github.com/WIA-Agent/workspace-intelligence-agent"
Documentation = "https://github.com/WIA-Agent/workspace-intelligence-agent#readme"
Repository = "https://github.com/WIA-Agent/workspace-intelligence-agent"
Issues = "https://github.com/WIA-Agent/workspace-intelligence-agent/issues"

[tool.setuptools.package-dir]
app = "backend/app"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
