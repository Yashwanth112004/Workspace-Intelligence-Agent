[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wia-agent"
version = "0.1.5"
description = "Workspace Intelligence Agent (WIA) — Graph-grounded workspace intelligence platform for code understanding, AST parsing, flow tracing, and RAG Q&A"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "WIA Architecture Team", email = "architect@wia-agent.dev"}
]
keywords = [
    "codebase-intelligence",
    "workspace-intelligence",
    "ast-parser",
    "knowledge-graph",
    "nvidia-nim",
    "hybrid-retrieval",
    "code-rag",
    "flow-tracing",
    "impact-analysis",
    "developer-onboarding"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "click>=8.1.0",
    "pathspec>=0.11.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.0",
    "GitPython>=3.1.0",
    "tree-sitter>=0.21.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6",
    "openai>=1.0.0",
    "rich>=13.0.0",
    "networkx>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
    "twine>=4.0.0"
]
ai = [
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-genai>=0.1.0"
]
postgres = [
    "psycopg2-binary>=2.9.0"
]

[project.urls]
Homepage = "https://github.com/Yashwanth112004/Workspace-Intelligence-Agent"
Documentation = "https://github.com/Yashwanth112004/Workspace-Intelligence-Agent#readme"
Repository = "https://github.com/Yashwanth112004/Workspace-Intelligence-Agent.git"
"Bug Tracker" = "https://github.com/Yashwanth112004/Workspace-Intelligence-Agent/issues"

[project.scripts]
wia = "wia.cli.app:cli_entrypoint"
wia-agent = "wia.cli.app:cli_entrypoint"

[tool.setuptools.packages.find]
where = ["."]
include = ["wia*", "backend*"]

[tool.pyright]
extraPaths = ["backend"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = [".", "backend"]
testpaths = ["tests"]
python_files = ["test_*.py"]
