name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python ${{ matrix.python-version }} Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure Git environment
        run: |
          git config --global --add safe.directory "*"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run automated test suite
        run: |
          pytest -v --tb=short 2>&1 | tee pytest_output.log

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f pytest_output.log ]; then
            echo "### Pytest Summary (${{ matrix.python-version }})" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 pytest_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build package distributions
        run: |
          python -m build

      - name: Validate distribution packages
        run: |
          twine check dist/*

  extension-test:
    name: VS Code Extension Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install extension dependencies
        working-directory: ./vscode-extension
        run: npm ci

      - name: Compile extension
        working-directory: ./vscode-extension
        run: npm run compile

      - name: Run extension tests
        working-directory: ./vscode-extension
        run: npm test

      - name: Package VSIX
        working-directory: ./vscode-extension
        run: npx @vscode/vsce package
