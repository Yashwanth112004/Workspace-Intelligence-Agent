version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wia-postgres
    environment:
      POSTGRES_DB: wia_db
      POSTGRES_USER: wia_user
      POSTGRES_PASSWORD: wia_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wia_user -d wia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wia-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://wia_user:wia_password@postgres:5432/wia_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - wia_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: wia-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
  wia_data:
